name: Build Regional IPTV
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Combine IPTV channels
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          sources = [
            ('Kurdish', 'languages/kur'),
            ('Turkish', 'countries/tr'),
            ('Iranian', 'countries/ir'),
            ('Iraqi', 'countries/iq'),
            ('Arabic', 'languages/ara'),
            ('New Zealand', 'countries/nz'),
            ('English', 'languages/eng'),
            ('Sports', 'categories/sports'),
            ('Movies', 'categories/movies'),
            ('Series', 'categories/series'),
            ('Documentaries', 'categories/documentary'),
            ('Kids', 'categories/kids'),
            ('Music', 'categories/music'),
            ('News', 'categories/news'),
            ('Entertainment', 'categories/entertainment'),
          ]

          lines = ['#EXTM3U']
          seen = set()
          fite = 'https://d3d85c7qkywguj.cloudfront.net/scheduler/scheduleMaster/263.m3u8'
          lines += ['#EXTINF:-1 tvg-name="FITE 24/7" group-title="Sports",FITE 24/7', fite]
          seen.add(fite)
          movie_url = 'https://archive.org/download/ArcherProductionsInc/DuckandC1951.mp4'
          lines += [
              '#EXTINF:-1 tvg-name="Movie Playback Test" group-title="English Movies",Movie Playback Test',
              movie_url
          ]
          seen.add(movie_url)        
          kurdish_channels = [
              ('Kurdmax', 'https://6476e46b58f91.streamlock.net/liveTrans/KurdmaxS0rani!/playlist.m3u8'),
              ('Kurdmax Show', 'https://6476e46b58f91.streamlock.net/liveTrans/SHOW1/playlist.m3u8'),
              ('Kurdmax Music', 'https://6476e46b58f91.streamlock.net/music/livestream/playlist.m3u8'),
          ]
          for name, url in kurdish_channels:
              if url not in seen:
                  lines.append(f'#EXTINF:-1 tvg-name="{name}" group-title="Kurdish",{name}')
                  lines.append(url)
                  seen.add(url)
          for group, path in sources:
            url = 'https://iptv-org.github.io/iptv/' + path + '.m3u'
            try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=35) as response:
                data = response.read().decode('utf-8-sig', errors='replace')
            except Exception as error:
              print('Skipped', group, error)
              continue

            pending = None
            added = 0
            for raw in data.splitlines():
              line = raw.strip()
              if line.startswith('#EXTINF:'):
                pending = line
                continue
              if not pending or not line or line.startswith('#'):
                continue
              if not line.startswith(('http://', 'https://')) or line in seen:
                pending = None
                continue
              if added >= 250:
                break
              name = pending.rsplit(',', 1)[-1].strip() or 'Unknown'
              name = re.sub(r'[\x00-\x1f"]', '', name)
              attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', pending))
              tvg = attrs.get('tvg-id', '').replace('"', '')
              logo = attrs.get('tvg-logo', '').replace('"', '')
              info = f'#EXTINF:-1 tvg-id="{tvg}" tvg-name="{name}" tvg-logo="{logo}" group-title="{group}",{name}'
              lines.extend([info, line])
              seen.add(line)
              added += 1
              pending = None
            print(group, added)

          if len(lines) < 10:
            raise RuntimeError('Not enough channels downloaded')
          with open('regional.m3u', 'w', encoding='utf-8') as file:
            file.write('\n'.join(lines) + '\n')
          PY
      - name: Publish playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regional.m3u
          if ! git diff --cached --quiet; then
            git commit -m 'Update Regional IPTV channels'
            git push
          fi
